services:
  frontend-dev:
    container_name: boolean.frontend.dev
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    ports:
      - ${CLIENT_PORT}:4200
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - nginx-net

  backend-dev:
    container_name: boolean.backend.dev
    build:
      context: backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - ${API_PORT}:8000
    depends_on:
      rabbitmq-dev:
        condition: service_healthy
      database-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
    networks:
      - nginx-net
      - pg-net
      - metrics-net
      - rabbitmq-net
    command: sh -c "npm run start:dev"
#    command: sh -c "npm run migrate && npm run start:dev"

  nginx-dev:
    container_name: boolean.nginx.dev
    image: nginx:latest
    env_file:
      - .env.dev
    ports:
      - ${NGINX_PORT}:80
    volumes:
      - ./config/nginx/nginx-dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend-dev
      - frontend-dev
    networks:
      - nginx-net

  rabbitmq-dev:
    image: rabbitmq:4.0-management
    container_name: boolean.rabbitmq.dev
    ports:
      - ${RABBITMQ_PORT}:5672
      - "15672:15672"
    env_file:
      - .env.dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./data-dev/rabbitmq:/var/lib/rabbitmq
    networks:
      - rabbitmq-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s

  database-dev:
    container_name: boolean.postgres.dev
    image: postgres:16.4-alpine
    env_file:
      - .env.dev
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ./data-dev/postgres:/var/lib/postgresql/data
    networks:
      - pg-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin-dev:
    container_name: boolean.pgadmin.dev
    image: dpage/pgadmin4
    env_file:
      - .env.dev
    ports:
      - ${PGADMIN_DEFAULT_PORT}:80
    depends_on:
      database-dev:
        condition: service_healthy
    networks:
      - pg-net

  redis-dev:
    container_name: boolean.redis.dev
    image: redis:latest
    env_file:
      - .env.dev
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - ./data-dev/redis:/data
    networks:
      - pg-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]

  prometheus-dev:
    container_name: boolean.prometheus.dev
    image: prom/prometheus:latest
    env_file:
      - .env.dev
    ports:
      - ${PROMETHEUS_PORT}:9090
    depends_on:
      - backend-dev
    volumes:
      - ./config/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml
      - ./data-dev/prometheus:/prometheus
    networks:
      - metrics-net

  loki-dev:
    container_name: boolean.loki.dev
    image: grafana/loki:latest
    env_file:
      - .env.dev
    ports:
      - ${LOKI_PORT}:3100
    volumes:
      - ./data-dev/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - metrics-net

  grafana-dev:
    container_name: boolean.grafana.dev
    image: grafana/grafana:latest
    env_file:
      - .env.dev
    ports:
      - ${GRAFANA_PORT}:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
    volumes:
      - ./data-dev/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    command:
      - sh
      - -c
      - |
        cp /etc/grafana/provisioning/datasources/datasource.dev.yaml /etc/grafana/provisioning/datasources/datasources.yaml
        /run.sh
    depends_on:
      - prometheus-dev
      - loki-dev
    networks:
      - metrics-net

networks:
  pg-net:
    driver: bridge
  nginx-net:
    driver: bridge
  metrics-net:
    driver: bridge
  rabbitmq-net:
    driver: bridge